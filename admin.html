<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin rozvrhu</title><link rel="stylesheet" href="style.css"></head><body class="admin"><div class="app"><div class="top"><div><h1 id="pageTitle">Admin rozvrhu</h1><div class="sub">Klikni na hodinu pro změnu, do prázdna pro suplování, na název dne pro nepřítomnost.</div></div><div class="controls"><span id="dirty" class="sub">Uloženo</span><a class="btn" href="index.html">Veřejný rozvrh</a><button class="btn green" id="saveGitHub" disabled>Uložit na GitHub</button></div></div><div class="adminbox"><div class="field"><label>Fine-grained GitHub token</label><input type="password" id="tokenInput" placeholder="github_pat_…" autocomplete="off"></div><button class="btn primary" id="connect">Připojit / načíst</button><button class="btn red" id="disconnect">Odpojit token</button><span class="status" id="tokenState"></span></div><div class="notice" id="notice"></div><div class="top"><span></span><div class="controls"><button class="btn" id="prevWeek">‹</button><button class="btn" id="todayBtn">Dnes</button><button class="btn" id="nextWeek">›</button><span class="week" id="weekLabel"></span><button class="btn primary" id="addSub">+ Suplování</button><button class="btn red" id="addAbs">Chybím</button></div></div><div class="shell"><div class="sched"><div style="position:relative"><div class="corner">čas</div><div class="head" id="timeHeader"></div></div><div id="days"></div></div></div><p class="hint">Token se neukládá do repozitáře; zůstává jen v sessionStorage do zavření relace prohlížeče.</p></div>
<dialog id="dlg"><div class="modal"><h2 id="dlgTitle">Upravit</h2><div class="form"><div class="field full"><label>Stav</label><select id="fStatus"><option value="normal">Běžná hodina / změna</option><option value="cancelled">Hodina odpadá</option></select></div><div class="field"><label>Datum</label><input type="date" id="fDate"></div><div class="field"><label>Předmět</label><input id="fSubject"></div><div class="field"><label>Třída</label><input id="fClass"></div><div class="field"><label>Učebna</label><input id="fRoom"></div><div class="field"><label>Od</label><input type="time" id="fStart"></div><div class="field"><label>Do</label><input type="time" id="fEnd"></div><div class="field full"><label>Poznámka</label><textarea id="fNote"></textarea></div></div><div class="actions"><button class="btn red hidden" id="del">Smazat</button><span></span><div><button class="btn" onclick="dlg.close()">Zrušit</button> <button class="btn primary" id="saveLesson">Použít změnu</button></div></div></div></dialog>
<dialog id="adlg"><div class="modal"><h2>Nepřítomnost</h2><div class="field"><label>Datum</label><input type="date" id="aDate"></div><br><div class="field"><label>Poznámka</label><input id="aNote" placeholder="školení, nemoc…"></div><div class="actions"><button class="btn red hidden" id="adel">Zrušit nepřítomnost</button><div><button class="btn" onclick="adlg.close()">Zavřít</button> <button class="btn primary" id="asave">Použít</button></div></div></div></dialog>
<script src="common.js"></script><script src="admin.js"></script></body></html>
